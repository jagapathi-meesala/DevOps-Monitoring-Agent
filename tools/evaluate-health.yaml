name: evaluate-health
description: Evaluate service states and infrastructure metrics against supplied thresholds.
input_schema:
  type: object
  required:
    - services
    - metrics
  properties:
    services:
      type: array
      description: Service observations with name and status.
      items:
        type: object
    metrics:
      type: object
      description: Numeric infrastructure utilization observations.
    thresholds:
      type: object
      description: Optional utilization thresholds.
output_schema:
  type: object
implementation:
  type: script
  path: evaluate-health.py
  runtime: python3
annotations:
  read_only: true
  cost: none
  idempotent: true
